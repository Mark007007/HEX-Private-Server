name: HEX Private Server CI

concurrency:
  group: hex-private-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned upstream commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hex-server rev-parse HEAD)" = "c65f2cf7e78797fb6d9da9a3401345da7cead71d"
          test "$(git -C upstream/Dingler-FrostRingArena rev-parse HEAD)" = "8c06748080ab3fd15d67a6b2f7193615ffd2db02"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply integration overlay
        run: bash scripts/apply_integration.sh

      - name: Integration tests
        run: python -m unittest discover -s tests -v

      - name: Python syntax check
        run: python -m py_compile $(find integration hex-server -name '*.py' -print)

      - name: Authoritative server startup smoke test
        shell: bash
        working-directory: hex-server
        run: |
          set -euo pipefail
          required_records=(
            Records/CardTemplate.jsonl
            Records/AbilityTemplate.jsonl
            Records/EncounterDeck.jsonl
          )
          missing=0
          for path in "${required_records[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::notice::Skipping authoritative server startup smoke test because $path is missing."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 0
          fi

          export HEX_DB_PATH="$RUNNER_TEMP/hex-server-smoke.db"
          export PYTHONPATH="$PWD"
          python -m pip install -q -r requirements.txt

          python - <<'PY'
          import socket
          import subprocess
          import sys
          import time

          proc = subprocess.Popen(
              [sys.executable, "-u", "hconnect_server.py"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          try:
              deadline = time.time() + 20
              last_error = None
              while time.time() < deadline:
                  if proc.poll() is not None:
                      output = proc.stdout.read() if proc.stdout else ""
                      raise SystemExit(
                          f"hconnect_server.py exited with {proc.returncode} before TCP 9933 was ready.\n{output}"
                      )
                  sock = socket.socket()
                  sock.settimeout(0.5)
                  try:
                      sock.connect(("127.0.0.1", 9933))
                      print("authoritative HConnect server is listening on 127.0.0.1:9933")
                      break
                  except OSError as exc:
                      last_error = exc
                      time.sleep(0.5)
                  finally:
                      sock.close()
              else:
                  output = proc.stdout.read() if proc.stdout else ""
                  raise SystemExit(
                      f"hconnect_server.py did not open TCP 9933 within 20s; last error={last_error}\n{output}"
                  )
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait(timeout=5)
          PY

      - name: Server regression tests
        working-directory: hex-server
        run: |
          if [[ -f Records/CardTemplate.jsonl && -f Records/AbilityTemplate.jsonl && -f Records/EncounterDeck.jsonl ]]; then
            python -m unittest tests.tests_encoding tests.tests_commands tests.tests_arena -v
          else
            echo "::notice::Skipping upstream server regression tests because the public upstream tree does not include the client-derived Records/*.jsonl snapshot."
          fi

  dingler-reference:
    runs-on: windows-latest
    steps:
      - name: Checkout integration project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Stage HEX client DLLs into Dingler documented paths
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "client-runtime"
          $dingler = Join-Path $env:GITHUB_WORKSPACE "upstream/Dingler-FrostRingArena"
          $compileDir = Join-Path $dingler "DLLs"
          $runtimeDir = Join-Path $dingler "Dingler.Terminal/bin/Release/net10.0"

          New-Item -ItemType Directory -Force -Path $compileDir, $runtimeDir | Out-Null

          $compileDlls = @(
            "Assembly-CSharp-firstpass.dll",
            "NCalc.dll",
            "ICSharpCode.SharpZipLib.dll"
          )
          $allDlls = @(
            "Assembly-CSharp-firstpass.dll",
            "ICSharpCode.SharpZipLib.dll",
            "NCalc.dll",
            "SampleClassLibrary.dll",
            "System.EnterpriseServices.dll",
            "System.Web.Services.dll",
            "UnityEngine.dll"
          )

          foreach ($dll in $compileDlls) {
            Copy-Item -LiteralPath (Join-Path $source $dll) -Destination (Join-Path $compileDir $dll) -Force
          }
          foreach ($dll in $allDlls) {
            Copy-Item -LiteralPath (Join-Path $source $dll) -Destination (Join-Path $runtimeDir $dll) -Force
          }

          Write-Host "Dingler compile DLLs: $compileDir"
          Get-ChildItem -LiteralPath $compileDir -Filter *.dll | Select-Object Name,Length
          Write-Host "Dingler runtime DLLs: $runtimeDir"
          Get-ChildItem -LiteralPath $runtimeDir -Filter *.dll | Select-Object Name,Length

      - name: Build upstream Dingler reference
        working-directory: upstream/Dingler-FrostRingArena
        run: dotnet build Dingler.slnx -c Release --nologo

      - name: Verify Dingler release directory
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:GITHUB_WORKSPACE "upstream/Dingler-FrostRingArena/Dingler.Terminal/bin/Release/net10.0"
          if (-not (Test-Path (Join-Path $runtimeDir "Dingler.Terminal.dll"))) {
            throw "Dingler.Terminal.dll was not produced"
          }
          $required = @(
            "Assembly-CSharp-firstpass.dll",
            "ICSharpCode.SharpZipLib.dll",
            "NCalc.dll",
            "SampleClassLibrary.dll",
            "System.EnterpriseServices.dll",
            "System.Web.Services.dll",
            "UnityEngine.dll"
          )
          foreach ($dll in $required) {
            $path = Join-Path $runtimeDir $dll
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing runtime DLL in Dingler release directory: $path"
            }
          }
          Get-ChildItem -LiteralPath $runtimeDir -Filter *.dll |
            Select-Object Name,Length

  original-ai-worker:
    runs-on: windows-latest
    steps:
      - name: Checkout integration project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Original AI worker
        run: dotnet build legacy-ai-worker/LegacyAiWorker.csproj -c Release --nologo

      - name: Verify uploaded HEX client runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:GITHUB_WORKSPACE "client-runtime"
          $required = @(
            "Assembly-CSharp-firstpass.dll",
            "ICSharpCode.SharpZipLib.dll",
            "NCalc.dll",
            "SampleClassLibrary.dll",
            "System.EnterpriseServices.dll",
            "System.Web.Services.dll",
            "UnityEngine.dll"
          )
          foreach ($dll in $required) {
            $path = Join-Path $runtime $dll
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing client DLL: $path"
            }
            $size = (Get-Item -LiteralPath $path).Length
            if ($size -le 0) {
              throw "Empty client DLL: $path"
            }
            Write-Host "found: $dll ($size bytes)"
          }

      - name: Stage HEX client DLLs into Dingler runtime layout
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "client-runtime"
          $runtime = Join-Path $env:GITHUB_WORKSPACE "upstream/Dingler-FrostRingArena/Dingler.Terminal/bin/Release/net10.0"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $required = @(
            "Assembly-CSharp-firstpass.dll",
            "ICSharpCode.SharpZipLib.dll",
            "NCalc.dll",
            "SampleClassLibrary.dll",
            "System.EnterpriseServices.dll",
            "System.Web.Services.dll",
            "UnityEngine.dll"
          )
          foreach ($dll in $required) {
            Copy-Item -LiteralPath (Join-Path $source $dll) -Destination (Join-Path $runtime $dll) -Force
          }
          Get-ChildItem -LiteralPath $runtime -Filter *.dll | Select-Object Name,Length

      - name: Inspect HEX client AI type surface
        shell: pwsh
        env:
          HEX_CLIENT_DLL: ${{ github.workspace }}/upstream/Dingler-FrostRingArena/Dingler.Terminal/bin/Release/net10.0/Assembly-CSharp-firstpass.dll
        run: |
          $asm = [System.Reflection.Assembly]::LoadFrom($env:HEX_CLIENT_DLL)
          try {
            $types = $asm.GetTypes()
          } catch [System.Reflection.ReflectionTypeLoadException] {
            $types = $_.Exception.Types | Where-Object { $_ -ne $null }
            Write-Warning "Some client types could not be loaded; listing all types that were resolved."
          }
          $matches = $types |
            Where-Object { $_.FullName -match '(?i)(^|[.])AI|AITactical|Artificial|Player|Session|Transaction' } |
            Sort-Object FullName
          if (-not $matches) {
            throw "No AI/Player/Session/Transaction types found in Assembly-CSharp-firstpass.dll"
          }
          $matches | ForEach-Object { $_.FullName }
          "assembly_location=$($asm.Location)"
          "assembly_full_name=$($asm.FullName)"

      - name: Worker protocol smoke test
        shell: bash
        run: |
          set -euo pipefail
          out="$(
            printf '%s\n' '{"protocol":1,"request_id":"ci-health","action":"health","payload":{}}' |
            dotnet legacy-ai-worker/bin/Release/net10.0/LegacyAiWorker.dll
          )"
          echo "$out"
          echo "$out" | grep -q '"request_id":"ci-health"'
          echo "$out" | grep -Eq '"status":"blocked"|"status":"ready"'

      - name: Original AI client runtime health test
        shell: bash
        env:
          HEX_CLIENT_DLL: ${{ github.workspace }}/upstream/Dingler-FrostRingArena/Dingler.Terminal/bin/Release/net10.0/Assembly-CSharp-firstpass.dll
        run: |
          set -euo pipefail
          out="$(
            printf '%s\n' '{"protocol":1,"request_id":"client-health","action":"health","payload":{}}' |
            dotnet legacy-ai-worker/bin/Release/net10.0/LegacyAiWorker.dll
          )"
          echo "$out"
          echo "$out" | grep -q '"request_id":"client-health"'
          echo "$out" | grep -q '"status":"ready"'

      - name: Original AI session construction probe
        shell: bash
        env:
          HEX_CLIENT_DLL: ${{ github.workspace }}/upstream/Dingler-FrostRingArena/Dingler.Terminal/bin/Release/net10.0/Assembly-CSharp-firstpass.dll
        run: |
          set -euo pipefail
          out="$(
            printf '%s\n' '{"protocol":1,"request_id":"client-probe","action":"probe","payload":{"session_uid64":900001,"ai_player_uid64":900002,"human_player_uid64":900003,"ai_position":1,"session_name":"CI Original AI Probe"}}' |
            dotnet legacy-ai-worker/bin/Release/net10.0/LegacyAiWorker.dll
          )"
          echo "$out"
          echo "$out" | grep -q '"request_id":"client-probe"'
          echo "$out" | grep -q '"status":"ready"'
          echo "$out" | grep -q '"active_sessions":1'
