name: HEX Private Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned upstream commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hex-server rev-parse HEAD)" = "c65f2cf7e78797fb6d9da9a3401345da7cead71d"
          test "$(git -C upstream/Dingler-FrostRingArena rev-parse HEAD)" = "8c06748080ab3fd15d67a6b2f7193615ffd2db02"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply integration overlay
        run: bash scripts/apply_integration.sh

      - name: Integration tests
        run: python -m unittest discover -s tests -v

      - name: Python syntax check
        run: python -m py_compile $(find integration hex-server -name '*.py' -print)

      - name: Server regression tests
        working-directory: hex-server
        run: |
          if [[ -f Records/CardTemplate.jsonl && -f Records/AbilityTemplate.jsonl && -f Records/EncounterDeck.jsonl ]]; then
            python -m unittest tests.tests_encoding tests.tests_commands tests.tests_arena -v
          else
            echo "::notice::Skipping upstream server regression tests because the public upstream tree does not include the client-derived Records/*.jsonl snapshot."
          fi

  original-ai-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Original AI worker
        run: dotnet build legacy-ai-worker/LegacyAiWorker.csproj -c Release --nologo

      - name: Verify uploaded HEX client runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/.github/workflows"
          required=(
            "Assembly-CSharp-firstpass.dll"
            "ICSharpCode.SharpZipLib.dll"
            "NCalc.dll"
            "SampleClassLibrary.dll"
            "System.EnterpriseServices.dll"
            "System.Web.Services.dll"
            "UnityEngine.dll"
          )
          for dll in "${required[@]}"; do
            test -s "$runtime/$dll"
            echo "found: $dll ($(stat -c%s "$runtime/$dll") bytes)"
          done

      - name: Worker protocol smoke test
        shell: bash
        run: |
          set -euo pipefail
          out="$(
            printf '%s\n' '{"protocol":1,"request_id":"ci-health","action":"health","payload":{}}' |
            dotnet legacy-ai-worker/bin/Release/net10.0/LegacyAiWorker.dll
          )"
          echo "$out"
          echo "$out" | grep -q '"request_id":"ci-health"'
          echo "$out" | grep -Eq '"status":"blocked"|"status":"ready"'

      - name: Original AI client runtime health test
        shell: bash
        env:
          HEX_CLIENT_DLL: ${{ github.workspace }}/.github/workflows/Assembly-CSharp-firstpass.dll
        run: |
          set -euo pipefail
          out="$(
            printf '%s\n' '{"protocol":1,"request_id":"client-health","action":"health","payload":{}}' |
            dotnet legacy-ai-worker/bin/Release/net10.0/LegacyAiWorker.dll
          )"
          echo "$out"
          echo "$out" | grep -q '"request_id":"client-health"'
          echo "$out" | grep -q '"status":"ready"'
